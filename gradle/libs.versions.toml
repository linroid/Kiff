[versions]
kotlin = "2.4.20"
okio = "3.18.2"
clikt = "5.1.0"
kotlinx-serialization = "1.11.0"
vanniktech = "0.37.0"
[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-nodefilesystem = { module = "com.squareup.okio:okio-nodefilesystem", version.ref = "okio" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
# Dotted rather than inline, which would not fit on one line.
kotlinx-serialization-json.module = "org.jetbrains.kotlinx:kotlinx-serialization-json"
kotlinx-serialization-json.version.ref = "kotlinx-serialization"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-publish = { id = "com.vanniktech.maven.publish.base", version.ref = "vanniktech" }
