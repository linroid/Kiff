name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild the CLI for and attach it to, such as v0.1.0
        required: true
        type: string
      maven:
        description: Also upload the library to Maven Central, which takes each version only once
        required: false
        type: boolean
        default: false

# Two runs for one tag would each find no release and create a draft apiece.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The tag is the version: nothing in the source says which release a commit is.
  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - id: version
        run: |
          # The same versions as kiff --use and the action's kiff-version input take.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tags are vX.Y.Z with an optional -suffix, so '$TAG' is not one."
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$(tr '[:upper:]' '[:lower:]' <<< "$version")" == *-snapshot ]]; then
            echo "::error::$TAG names a snapshot, which is not released."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each platform's executable, run on a machine of that platform, and the JVM zip. A manual run
  # takes this workflow from the branch it was started on, but builds the tag.
  cli:
    name: Build the CLI
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/cli-binaries.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  attach:
    name: Attach the CLI
    needs: [ version, cli ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kiff-cli-release
          path: dist

      - name: Check every file is there
        working-directory: dist
        run: |
          files=("kiff-$VERSION.zip")
          for platform in linux-x64 linux-arm64 macos-arm64 macos-x64 windows-x64.exe; do
            files+=("kiff-$VERSION-$platform")
          done
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || ! -f "$file.sha256" ]]; then
              echo "::error::The build gave no $file or no $file.sha256."
              exit 1
            fi
          done
          sha256sum --check ./*.sha256
          ls -l

      # Publishing stays with the maintainer: this only ever creates a draft, and re-runs replace
      # the files on whatever release the tag already has. The executables are attached bare, so
      # nothing needs unpacking.
      - name: Attach to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" kiff-* --clobber

  maven:
    name: Upload to Maven Central
    # The version job reads the version from the tag and refuses a snapshot. A build without
    # -Pversion is 0.0.0-SNAPSHOT, which would go to Central's snapshot repository instead.
    needs: version
    # A tag always uploads. A manual run uploads only when asked, since it is usually there to
    # rebuild the CLI for a version Central already has.
    if: github.event_name == 'push' || inputs.maven
    # Only a Mac builds the Apple targets. Elsewhere kotlin.native.ignoreDisabledTargets would skip
    # them quietly and upload a release without them.
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # The same secrets as linroid/Ketch. An unset one arrives as an empty string, and the plugin
      # would only say so after compiling every target.
      - name: Check the secrets are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY_ID SIGNING_KEY \
            SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name repository secret is not set."
              missing=1
            fi
          done
          exit "$missing"

      # Uploads one deployment. Like the GitHub release, it is left for the maintainer to publish
      # from the Central Portal, since a published version can never be changed or removed. The
      # plugin waits for Central's validation only when it publishes, so a green run does not mean
      # the deployment passed: the portal shows whether it did. The plugin reads the signing key
      # from its own signingInMemoryKey properties.
      - name: Upload the library
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "::error::The version job gave no version for $TAG."
            exit 1
          fi
          ./gradlew -Pversion="$VERSION" :library:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
