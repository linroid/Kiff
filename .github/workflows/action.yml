name: Action

# Runs the action in this repository against the fixed releases of linroid/kiff-fixtures, which it
# only reads: see that repository's README for what each release is for.
on:
  push:
    branches: [ main ]
    paths:
      - action.yml
      - action/**
      - build.gradle.kts
      - gradle.properties
      - cli/**
      - library/**
      - .github/scripts/**
      - .github/workflows/action.yml
  # No branches filter, so a pull request stacked on another one is tested too.
  pull_request:
    paths:
      - action.yml
      - action/**
      - build.gradle.kts
      - gradle.properties
      - cli/**
      - library/**
      - .github/scripts/**
      - .github/workflows/action.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FIXTURES: linroid/kiff-fixtures

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the scripts
        run: shellcheck --external-sources action/*.sh .github/scripts/*.sh

      - name: Test how the action finds its own release
        run: .github/scripts/test-lib.sh

  action:
    name: Action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only caches Gradle's downloads for the build the action runs from source.
      - uses: gradle/actions/setup-gradle@v6

      # First, since it fails while planning, before the CLI is built.
      - name: Refuse a pattern that matches several files
        id: ambiguous
        continue-on-error: true
        uses: ./
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.3.0
          assets: '*'
          upload: false

      - name: Check that the ambiguous pattern failed
        env:
          OUTCOME: ${{ steps.ambiguous.outcome }}
        run: |
          if [[ $OUTCOME != failure ]]; then
            echo "::error::assets '*' matches four files of v1.3.0, so the action should fail," \
              "but its outcome is $OUTCOME."
            exit 1
          fi

      - name: Patch v1.3.0 from the three releases before it
        id: latest
        uses: ./
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.3.0
          assets: |
            app-*.apk
            desktop-*.zip
            tool-*.bin
            noise-*.bin
          upload: false

      # v1.2.1 is a hotfix published after v1.3.0, but comes before it. v1.1.0 has no tool, so
      # tool's third patch comes from v1.0.0. Every noise patch is near full size and dropped.
      - name: Check the patches of v1.3.0
        env:
          PATCHES: ${{ steps.latest.outputs.patches }}
          COUNT: ${{ steps.latest.outputs.count }}
          MANIFEST: ${{ steps.latest.outputs.manifest }}
        run: |
          .github/scripts/expect-patches.sh <<'EOF'
          app-1.3.0.apk v1.2.1
          app-1.3.0.apk v1.2.0
          app-1.3.0.apk v1.1.0
          desktop-1.3.0.zip v1.2.1
          desktop-1.3.0.zip v1.2.0
          desktop-1.3.0.zip v1.1.0
          tool-1.3.0.bin v1.2.1
          tool-1.3.0.bin v1.2.0
          tool-1.3.0.bin v1.0.0
          EOF
          if ! jq -e '.files[] | select(.name == "noise-1.3.0.bin") | .patches == []' \
            "$MANIFEST" > /dev/null; then
            echo "::error::The manifest should list noise-1.3.0.bin with no patches."
            exit 1
          fi
          url=https://github.com/$FIXTURES/releases/download/v1.3.0/app-1.3.0.apk.from-v1.2.1.kiff
          if [[ $(jq -r '.[0].url' <<< "$PATCHES") != "$url" ]]; then
            echo "::error::The first patch should be at $url."
            exit 1
          fi

      # uses: ./ has no ref to find a release by, so the action builds this checkout, which is
      # no release whatever its tags.
      - name: Check the action built a snapshot of this commit
        env:
          MANIFEST: ${{ steps.latest.outputs.manifest }}
        run: |
          said=$(cli/build/install/kiff/bin/kiff --version)
          expected="kiff 0.0.0-SNAPSHOT ($(git rev-parse --short HEAD))"
          if [[ $said != "$expected" ]]; then
            echo "::error::The action's build of this checkout says '$said', not '$expected'."
            exit 1
          fi
          generator=$(jq -r .generator "$MANIFEST")
          if [[ $generator != 'kiff 0.0.0-SNAPSHOT' ]]; then
            echo "::error::The manifest's generator is $generator, not kiff 0.0.0-SNAPSHOT."
            exit 1
          fi

      - name: Restore every patch of v1.3.0
        env:
          MANIFEST: ${{ steps.latest.outputs.manifest }}
        run: |
          .github/scripts/restore-patches.sh cli/build/install/kiff/bin/kiff "$MANIFEST" \
            "$FIXTURES"

      - name: Patch the hotfix v1.2.1
        id: hotfix
        uses: ./
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.2.1
          assets: |
            app-*.apk
            tool-*.bin
          upload: false

      - name: Check v1.2.1 is never patched from v1.3.0
        env:
          PATCHES: ${{ steps.hotfix.outputs.patches }}
        run: |
          .github/scripts/expect-patches.sh <<'EOF'
          app-1.2.1.apk v1.2.0
          app-1.2.1.apk v1.1.0
          app-1.2.1.apk v1.0.0
          tool-1.2.1.bin v1.2.0
          tool-1.2.1.bin v1.0.0
          EOF

      - name: Patch the prerelease v1.4.0-rc.1
        id: prerelease
        uses: ./
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.4.0-rc.1
          assets: app-*.apk
          upload: false

      - name: Check v1.4.0-rc.1 is patched from v1.3.0 and before
        env:
          PATCHES: ${{ steps.prerelease.outputs.patches }}
        run: |
          .github/scripts/expect-patches.sh <<'EOF'
          app-1.4.0-rc.1.apk v1.3.0
          app-1.4.0-rc.1.apk v1.2.1
          app-1.4.0-rc.1.apk v1.2.0
          EOF

      - name: Patch v1.3.0 from v1.0.0 alone
        id: from
        uses: ./
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.3.0
          from: v1.0.0
          assets: |
            app-*.apk
            desktop-*.zip
            tool-*.bin
          upload: false

      - name: Check each file has one patch, from v1.0.0
        env:
          PATCHES: ${{ steps.from.outputs.patches }}
        run: |
          .github/scripts/expect-patches.sh <<'EOF'
          app-1.3.0.apk v1.0.0
          desktop-1.3.0.zip v1.0.0
          tool-1.3.0.bin v1.0.0
          EOF

      # v1.1.0 has no tool, which is a warning when from names it rather than a failure.
      - name: Patch v1.3.0 from a release without one of the files
        id: from-missing
        uses: ./
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.3.0
          from: |
            v1.1.0
            v1.0.0
          assets: |
            app-*.apk
            tool-*.bin
          name: '{target}.{from}-{to}.kiff'
          upload: false

      - name: Check the release without the file was passed over
        env:
          PATCHES: ${{ steps.from-missing.outputs.patches }}
        run: |
          .github/scripts/expect-patches.sh <<'EOF'
          app-1.3.0.apk v1.1.0
          app-1.3.0.apk v1.0.0
          tool-1.3.0.bin v1.0.0
          EOF
          name=$(jq -r '.[0].name' <<< "$PATCHES")
          if [[ $name != app-1.3.0.apk.v1.1.0-v1.3.0.kiff ]]; then
            echo "::error::The name input should give app-1.3.0.apk.v1.1.0-v1.3.0.kiff, not $name."
            exit 1
          fi

      # No Kiff release can be downloaded while v0.1.0 is a draft, so a mirror on localhost serves
      # release-shaped files instead, through KIFF_DOWNLOAD_URL as kiff --use reads it. 0.0.2-test
      # is the same zip under a checksum it does not have.
      - name: Serve test releases of the CLI
        run: |
          ./gradlew -Pversion=0.0.1-test :cli:distZip
          mirror=$RUNNER_TEMP/mirror
          mkdir -p "$mirror/v0.0.1-test" "$mirror/v0.0.2-test"
          cp cli/build/distributions/kiff-0.0.1-test.zip "$mirror/v0.0.1-test/"
          cp cli/build/distributions/kiff-0.0.1-test.zip "$mirror/v0.0.2-test/kiff-0.0.2-test.zip"
          cd "$mirror/v0.0.1-test"
          if command -v sha256sum > /dev/null; then
            sha256sum kiff-0.0.1-test.zip > kiff-0.0.1-test.zip.sha256
          else
            shasum -a 256 kiff-0.0.1-test.zip > kiff-0.0.1-test.zip.sha256
          fi
          printf '%064d  kiff-0.0.2-test.zip\n' 0 > "$mirror/v0.0.2-test/kiff-0.0.2-test.zip.sha256"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$mirror" \
            > "$RUNNER_TEMP/mirror.log" 2>&1 &
          for _ in $(seq 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::The test mirror did not start."
          cat "$RUNNER_TEMP/mirror.log"
          exit 1

      - name: Patch v1.2.1 with a chosen release of the CLI
        id: chosen
        uses: ./
        env:
          KIFF_DOWNLOAD_URL: http://127.0.0.1:8765
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.2.1
          assets: tool-*.bin
          kiff-version: 0.0.1-test
          upload: false

      - name: Check the chosen release made the patches
        env:
          PATCHES: ${{ steps.chosen.outputs.patches }}
          MANIFEST: ${{ steps.chosen.outputs.manifest }}
        run: |
          .github/scripts/expect-patches.sh <<'EOF'
          tool-1.2.1.bin v1.2.0
          tool-1.2.1.bin v1.0.0
          EOF
          generator=$(jq -r .generator "$MANIFEST")
          if [[ $generator != 'kiff 0.0.1-test' ]]; then
            echo "::error::kiff-version 0.0.1-test should have made the patches, not $generator."
            exit 1
          fi

      - name: Refuse a release of the CLI that does not match its checksum
        id: tampered
        continue-on-error: true
        uses: ./
        env:
          KIFF_DOWNLOAD_URL: http://127.0.0.1:8765
        with:
          repository: ${{ env.FIXTURES }}
          tag: v1.2.1
          assets: tool-*.bin
          kiff-version: 0.0.2-test
          upload: false

      # The mirror served both files, so the step failed on the checksum rather than a download.
      - name: Check the tampered release was refused
        env:
          OUTCOME: ${{ steps.tampered.outcome }}
        run: |
          if [[ $OUTCOME != failure ]]; then
            echo "::error::A zip that does not match its checksum should fail the action," \
              "but its outcome is $OUTCOME."
            exit 1
          fi
          for file in kiff-0.0.2-test.zip kiff-0.0.2-test.zip.sha256; do
            if ! grep -q "\"GET /v0.0.2-test/$file HTTP/1.1\" 200" "$RUNNER_TEMP/mirror.log"; then
              echo "::error::The action should have downloaded $file before refusing it."
              cat "$RUNNER_TEMP/mirror.log"
              exit 1
            fi
          done
