name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Examples say vX.Y.Z or <version>, and the badges say which release is the latest, so a release
  # needs no edit to the docs. A pinned release in them would go stale with the next one.
  pinned-releases:
    name: No pinned releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the docs and the action pin no Kiff release
        run: |
          pinned='linroid/[Kk]iff@v[0-9]|com\.linroid\.kiff:kiff(-[a-z0-9]+)?:[0-9]'
          if git grep -n -E "$pinned" -- README.md AGENTS.md action.yml; then
            echo "::error::Write vX.Y.Z or <version> in place of a Kiff release."
            exit 1
          fi

  jvm-tests:
    name: JVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # jvmTest matches only the library: the CLI is a plain JVM project, whose tests are :cli:test.
      - name: Run JVM and CLI tests
        run: ./gradlew jvmTest :cli:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jvm
          path: '**/build/test-results/**/TEST-*.xml'

  ios-tests:
    name: iOS Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios
          path: '**/build/test-results/**/TEST-*.xml'

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run JS Node and browser tests
        run: ./gradlew jsTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-js
          path: '**/build/test-results/**/TEST-*.xml'

  linux-tests:
    name: Linux Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Linux native tests
        run: ./gradlew linuxX64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: '**/build/test-results/**/TEST-*.xml'

  macos-tests:
    name: macOS Native Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run macOS native tests
        run: ./gradlew macosArm64Test

      # Publishing compiles each shared source set to metadata, which no test task does.
      # allMetadataJar covers common, native and posix; macosArm64MetadataElements covers apple,
      # ios and macos, which only a Mac can compile.
      - name: Compile shared source set metadata
        if: ${{ !cancelled() }}
        run: ./gradlew allMetadataJar macosArm64MetadataElements

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: '**/build/test-results/**/TEST-*.xml'

  publish-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [ jvm-tests, ios-tests, js-tests, linux-tests, macos-tests ]
    if: always()
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/TEST-*.xml'
